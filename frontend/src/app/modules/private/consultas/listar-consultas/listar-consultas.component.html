<div class="container">
  <div class="title">
    <h1> Lista de Consultas</h1>
  </div>
  <div class="mat-elevation-z8 content-table">
    <table class="table" mat-table [dataSource]="consultas">

      <ng-container matColumnDef="medico">
        <th mat-header-cell *matHeaderCellDef> Medico </th>
        <td mat-cell *matCellDef="let row"> {{ row.medico }} </td>
      </ng-container>

      <ng-container matColumnDef="especialidade">
        <th mat-header-cell *matHeaderCellDef> Especialidade </th>
        <td mat-cell *matCellDef="let row"> {{ row.especialidade }} </td>
      </ng-container>

      <ng-container matColumnDef="data">
        <th mat-header-cell *matHeaderCellDef> Data </th>
        <td mat-cell *matCellDef="let row"> {{ row.data }} </td>
      </ng-container>

      <ng-container matColumnDef="hora">
        <th mat-header-cell *matHeaderCellDef> Hora </th>
        <td mat-cell *matCellDef="let row"> {{ row.hora }} </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let row"> {{ row.status }} </td>
      </ng-container>

      <ng-container matColumnDef="senha">
        <th mat-header-cell *matHeaderCellDef> Senha </th>
        <td mat-cell *matCellDef="let row"> {{ row.senha }} </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th class="mat-header" mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let row"> 
          <a class="edit">
            <i class="material-icons">edit</i>
          </a>
          <a class="delete">
            <i class="material-icons">delete</i>
          </a>
        </td>
      </ng-container>
      
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
